<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1437"/>
      <stop offset="55%" stop-color="#162050"/>
      <stop offset="100%" stop-color="#2a1a6c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.2" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#orb1)"/>
  <rect width="1080" height="1080" fill="url(#orb2)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 120H1080"/><path d="M0 300H1080"/><path d="M0 480H1080"/>
    <path d="M0 660H1080"/><path d="M0 840H1080"/><path d="M0 1020H1080"/>
    <path d="M120 0V1080"/><path d="M300 0V1080"/><path d="M480 0V1080"/>
    <path d="M660 0V1080"/><path d="M840 0V1080"/><path d="M1020 0V1080"/>
  </g>

  <g transform="translate(70,70)">
    <rect width="86" height="86" rx="26" fill="url(#brand)"/>
    <text x="43" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#ffffff">P</text>
    <text x="106" y="58" font-family="Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="6" fill="#ffffff">PREPIUM</text>
  </g>

  <g transform="translate(350,250)">
    <rect width="380" height="380" rx="90" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="3"/>
    <g transform="translate(190,190)">
      <g transform="translate(-90,-70)">
        <rect x="0" y="18" width="180" height="34" rx="10" fill="#8b5cf6"/>
        <rect x="12" y="6" width="156" height="34" rx="10" fill="#6366f1"/>
        <rect x="24" y="-6" width="132" height="34" rx="10" fill="url(#brand)"/>
        <text x="90" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">AI STUDY</text>
      </g>
      <circle cx="-30" cy="95" r="30" fill="#22d3ee" opacity="0.35"/>
      <circle cx="30" cy="115" r="20" fill="#22d3ee" opacity="0.35"/>
    </g>
  </g>

  <text x="540" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff" filter="url(#glow)">Study with AI</text>
  <text x="540" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="rgba(255,255,255,0.72)">Courses, flashcards, quizzes &amp; an AI tutor</text>

  <g transform="translate(380,900)">
    <rect width="320" height="76" rx="38" fill="url(#brand)"/>
    <text x="160" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0b1437">Get Started</text>
  </g>
