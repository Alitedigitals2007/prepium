<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="55%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.2" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#orb1)"/>
  <rect width="1080" height="1080" fill="url(#orb2)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 120H1080"/><path d="M0 300H1080"/><path d="M0 480H1080"/>
    <path d="M0 660H1080"/><path d="M0 840H1080"/><path d="M0 1020H1080"/>
    <path d="M120 0V1080"/><path d="M300 0V1080"/><path d="M480 0V1080"/>
    <path d="M660 0V1080"/><path d="M840 0V1080"/><path d="M1020 0V1080"/>
  </g>

  <g transform="translate(70,70)">
    <rect width="86" height="86" rx="26" fill="url(#brand)"/>
    <text x="43" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#ffffff">P</text>
    <text x="106" y="58" font-family="Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="6" fill="#ffffff">PREPIUM</text>
  </g>

  <g transform="translate(350,250)">
    <rect width="380" height="380" rx="90" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="3"/>
    <g transform="translate(190,190)">
      <g transform="translate(-100,-95)">
        <circle cx="0" cy="0" r="46" fill="#f97316"/>
        <circle cx="95" cy="14" r="40" fill="#ef4444"/>
        <circle cx="48" cy="78" r="38" fill="#fb923c"/>
        <path d="M52 70l22-34m0 34V-20" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" fill="none"/>
      </g>
    </g>
  </g>

  <text x="540" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff" filter="url(#glow)">Squad Streaks</text>
  <text x="540" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="rgba(255,255,255,0.72)">Study with friends. If one misses, the streak burns.</text>

  <g transform="translate(380,900)">
    <rect width="320" height="76" rx="38" fill="url(#brand)"/>
    <text x="160" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">Join a Squad</text>
  </g>
</svg>