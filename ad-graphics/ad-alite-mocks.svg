        <path d="M20 62h130M20 96h130M20 130h130" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
        <rect x="30" y="78" width="34" height="34" rx="8" fill="#22d3ee"/>
        <path d="M36 146a7 7 0 0110 0M30 138a12 12 0 0118 0" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" fill="none"/>
