    </g>
  </g>

  <text x="540" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff" filter="url(#glow)">Alite Mocks</text>
  <text x="540" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="rgba(255,255,255,0.72)">Timed mock exams built for real success</text>

